[project]
name = "rag-sus"
version = "0.1.0"
description = "Assistente que responde perguntas sobre o relatório Gestão Hospitalar no SUS-SP, citando a página, e a avaliação estatística dele."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faiss-cpu>=1.9",
    "fastapi>=0.115",
    "fastembed>=0.5",
    "httpx>=0.27",
    "numpy>=1.26",
    "pdfplumber>=0.11",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "scipy>=1.13",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "statsmodels>=0.14",
]
analise = [
    "matplotlib>=3.9",
    "pandas>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_sus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "lento: precisa baixar o modelo de embeddings ou ler o PDF inteiro",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E741: "l" como nome de linha de CSV/JSONL é legível neste projeto.
# UP009: o cabeçalho "# -*- coding: utf-8 -*-" é convenção dos projetos do portfólio.
ignore = ["E741", "UP009"]
