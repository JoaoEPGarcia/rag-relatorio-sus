# Testes e construção da imagem Docker a cada push e pull request.
# Os testes marcados `lento` (PDF inteiro, modelo de embeddings) não rodam aqui.
name: ci

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check src tests scripts
      - run: uv run pytest -m "not lento" -q
      # Nenhum número digitado, e README, macros e NUMEROS_CANONICOS.md em dia com o registro
      # (não chama o modelo nem o pdflatex).
      - run: uv run python scripts/conferir_numeros.py

  docker:
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rag-sus .
      - name: A imagem importa a API
        run: docker run --rm rag-sus uv run --no-dev python -c "import rag_sus.api; print('ok')"
